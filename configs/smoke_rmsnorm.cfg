// Smoke-test cfg for the Tier-2 GPU resource-accounting verification.
// Smallest live problem (rmsnorm), small beam + depth budgets.

runtime:
{
    problem_path = "/home/hel19/workspace/projects/self-evolved-llm/repo/benchmark/SOL-ExecBench/data/benchmark/L1/069_rms_norm";
    reset_clocks = false;
};

hardware:
{
    gpu_index = 0;
    arch_config_path = "configs/arch/RTX6000Ada.yaml";
};

search:
{
    beam_width = 2;
    beam_diversity = true;
    reviewer_metric_queries = true;
    max_depth = 3;
    epsilon_start = 0.3;
    epsilon_end = 0.05;
};

eval:
{
    warmup_runs = 5;
    timed_runs = 20;
};

move_on:
{
    sol_plateau_window = 10;
    sol_plateau_delta = 0.01;
    sol_target = 0.95;
};

debug:
{
    max_debug_retries = 3;
    max_baseline_retries = 3;
};

memory:
{
    optimization_memory_top_k = 5;
};

benchmark:
{
    benchmark_workload_count = 3;
};
