# NVIDIA RTX 6000 Ada Generation (AD102, sm_89)
# Specs from NVIDIA datasheet:
#   https://images.nvidia.com/aem-dam/en-zz/Solutions/technologies/NVIDIA-ADA-GPU-PROVIZ-Architecture-Whitepaper_1.1.pdf
#
# MAC_per_cycle math: peak_FLOPS / (2 * freq_GHz * 1e9)  (matches SOLAR's
# H100_PCIe.yaml convention — half the peak since each MAC is 2 FLOPs).
name: "RTX6000Ada"
SRAM_capacity: 100663296   # 96 MiB L2 cache
SRAM_byte_per_cycle: 2200     # estimated L2 BW: ~5.5 TB/s @ 2.505 GHz
DRAM_capacity: 51539607552  # 48 GiB GDDR6 ECC
DRAM_byte_per_cycle: 383    # 960 GB/s / 2.505 GHz
freq_GHz: 2.505             # boost clock (datasheet)
MAC_per_cycle_fp32_sm: 18185  # 91.1 TFLOPS  (CUDA cores)
MAC_per_cycle_tf32_tc: 36347    # 182.1 TFLOPS dense
MAC_per_cycle_fp16_tc: 72695    # 364.2 TFLOPS dense
MAC_per_cycle_bf16_tc: 72695    # 364.2 TFLOPS dense
MAC_per_cycle_fp8_tc: 145409    # 728.5 TFLOPS dense
MAC_per_cycle_int8_tc: 145409   # 728.5 TOPS dense
# nvfp4 is Blackwell-only; Ada has no NVFP4 support
