// LLM-call Pareto experiment — regime 06: Patient-Coder
// max_debug_retries=4 → each K-candidate gets 10 turns (2*4+2), with
// 4 self-correction cycles. Replaces the original "Planner-deep" cell
// because planner_max_turns past its ceiling-4 adds no new behavior;
// max_debug_retries is the only retries-side knob with unbounded
// meaningful range.
// Expected total calls: ~150.

runtime:
{
    problem_path = "/home/hel19/workspace/projects/self-evolved-llm/repo/benchmark/SOL-ExecBench/data/benchmark/L1/048_fused_gate_up_projection_with_swiglu";
    reset_clocks = false;
    use_operator_baseline = false;
    triton_baseline_path = "/home/hel19/workspace/projects/self-evolved-llm/acts-kernel-agent/baseline/l1_048_fused_gate_up_projection_with_swiglu.py";
    triton_baseline_dps = false;
    triton_baseline_enforce_autotune = false;
};

hardware:
{
    gpu_index = 0;
    arch_config_path = "configs/arch/RTX6000Ada.yaml";
};

search:
{
    beam_width = 10;
    beam_diversity = true;
    reviewer_metric_queries = false;
    coder_n_candidates = 4;
    planner_max_turns = 2;
    reviewer_max_turns = 2;
    max_depth = 5;
    epsilon_start = 0.3;
    epsilon_end = 0.05;
};

eval:
{
    warmup_runs = 20;
    timed_runs = 100;
};

move_on:
{
    sol_plateau_window = 10;
    sol_plateau_delta = 0.01;
    sol_target = 0.95;
};

debug:
{
    max_debug_retries = 4;
    max_baseline_retries = 3;
};

memory:
{
    optimization_memory_top_k = 5;
};

benchmark:
{
    benchmark_workload_count = 3;
};
