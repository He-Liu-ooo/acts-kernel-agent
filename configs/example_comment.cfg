// ACTS configuration — libconfig format, consumed by `libconf` in
// `src/config.py::load_config`. All groups + keys are optional;
// omitted fields fall back to ACTSConfig dataclass defaults (see
// src/config.py). Pass this file via:
//     python -m src.pipeline.optimize --config configs/example.cfg
//
// This file is the fully-commented reference twin of configs/example.cfg
// (same values, no comments there). Keep the two in sync.
//
// The module-top preparse reads `hardware.gpu_index` from this file
// before any CUDA-aware import so `CUDA_VISIBLE_DEVICES` lands in time.

runtime:
{
    // Problem to optimize. Either a SOL-ExecBench problem directory
    // (containing definition.json + workload.jsonl) or the literal
    // string "placeholder" for the built-in no-LLM matmul demo.
    problem_path = "/home/hel19/workspace/projects/self-evolved-llm/acts-kernel-agent/benchmarks/flashinfer_trace/dsa_sparse_attention_h16_ckv512_kpe64_topk2048_ps64";

    // Operator escape hatch for SIGKILL / segfault recovery. When
    // true, main() resets the selected GPU's clocks and exits without
    // running the pipeline. Toggle on for one recovery run, then off.
    reset_clocks = false;

    // ── Operator-supplied Triton baseline (2026-05-16) ───────────────
    // When true, the .py at triton_baseline_path is loaded as the
    // search-tree root (7-gate sequence, hard-fail) instead of the
    // LLM-translated baseline. false (default) = LLM translation path.
    // Consistency: true + empty path raises; false + stray fields warn
    // ("ready-to-flip" carry is tolerated). See doc/config.md.
    use_operator_baseline = false;
    // Path to the operator's vetted Triton kernel source. Example
    // (L1-048): commented out so the DSA config loads without the
    // stray-field warn.
    // triton_baseline_path = "/home/hel19/workspace/projects/self-evolved-llm/acts-kernel-agent/baseline/l1_048_fused_gate_up_projection_with_swiglu.py";
    // Destination-passing-style kernel (outputs pre-allocated by caller).
    triton_baseline_dps = false;
    // Override the operator-baseline kernel's auto-detected `@triton.jit`
    // entrypoint when the file has multiple jitted functions. None/omit
    // falls back to the auto-detect path in the baseline loader.
    // triton_baseline_kernel_name = "fused_gate_up_swiglu_kernel";
    // When true, the operator kernel must carry a well-formed
    // @triton.autotune block (>=4 Configs + non-empty key=[...]).
    triton_baseline_enforce_autotune = false;

    // ── External reference baseline, Option C (2026-06-03) ───────────
    // Opt-in overlay: the implementation at reference_baseline_path
    // (a plain .py; entrypoint resolved by name) is measured once in
    // Phase A and its median latency becomes the SOL-score T_b for the
    // root AND every child — S=0.5 means "ties the reference", S>0.5
    // "beats it". The reference is correctness-gated against the
    // PyTorch reference on every selected workload first; ANY failure
    // (load / correctness / benchmark) hard-aborts the run. Omit both
    // (default) for today's behavior (T_b = Triton-root median).
    // Orthogonal to use_operator_baseline — composes with either root.
    // Consistency: path set + empty entrypoint raises; entrypoint set
    // + empty path warns (dead config).
    // See doc/specs/2026-06-03-external-reference-baseline-design.md.
    reference_baseline_path = "/home/hel19/workspace/projects/self-evolved-llm/acts-kernel-agent/benchmarks/flashinfer_trace/dsa_sparse_attention_h16_ckv512_kpe64_topk2048_ps64/reference_flashinfer.py";
    reference_baseline_entrypoint = "run";

    // Roots for resolving workload safetensors inputs declared with
    // relative paths (e.g. "./blob/..."). Omit for the default
    // [problem_path]. Needed when the blobs live OUTSIDE the problem
    // dir — e.g. the FlashInfer-trace layout keeps one container-level
    // symlink (benchmarks/flashinfer_trace/blob -> kda dataset blob
    // tree) shared by all problems under the container. Accepts an
    // array of paths; a bare string is treated as a single root.
    safetensors_blob_roots = ["/home/hel19/workspace/projects/self-evolved-llm/acts-kernel-agent/benchmarks/flashinfer_trace"];

    // ── Bench-subprocess isolation (2026-05-27) ──────────────────────
    // Per-iter K-way bench + autotune burn-in + NCU profile gauntlet
    // runs in a fresh `python -m src.eval.bench_worker` child so
    // sticky CUDA-context errors (cudaErrorIllegalAddress /
    // cudaErrorInvalidAddressSpace class) die with the child instead
    // of poisoning the rest of the run. See
    // doc/specs/2026-05-24-bench-subprocess-isolation-design.md.
    //
    // Flip to false for in-process debugging (single-step into bench
    // without IPC overhead). Mirrors `use_operator_baseline` pattern.
    bench_use_subprocess = true;

    // Consecutive worker-process crashes (non-zero exit or signal-kill)
    // before raising `WorkerProcessUnstable` and aborting the run.
    // Mirrors CUDAContextPoisoned's 3-strike escalation.
    worker_crash_threshold = 3;

    // Total-lifetime watchdog passed to `proc.wait(timeout=...)`.
    // Default 180000s (~50h) effectively disables the watchdog while
    // the refactor beds in — the original 30s default killed healthy
    // workers mid-NCU (Codex 2026-05-26). Operators with hard
    // wallclock budgets should set this explicitly to the actual
    // envelope (low thousands of seconds typically). See
    // doc/config.md for the full rationale.
    worker_timeout_s = 180000.0;

    // Total-lifetime watchdog for the correctness worker subprocess
    // (Coder check_correctness tool, reward-hack re-eval, baseline
    // post-verify). Deliberately NOT worker_timeout_s — correctness is
    // a fast check, so 180s bounds a hung candidate instead of letting
    // it stall the run for ~2 days under the bench ceiling.
    correctness_worker_timeout_s = 180.0;
};

hardware:
{
    // Physical GPU index (nvidia-smi numbering). The CLI sets
    // CUDA_VISIBLE_DEVICES from this value so torch + nvidia-smi see
    // the same physical device as logical index 0.
    gpu_index = 0;

    // Path to a SOLAR arch config YAML (e.g. configs/arch/H100_PCIe.yaml).
    // Empty string falls back to detect_hardware().
    arch_config_path = "configs/arch/RTX6000Ada.yaml";
};

search:
{
    // Beam width for the search tree's frontier pruning.
    beam_width = 10;
    // Diversity-aware beam pruning (B2/B3): penalize same-action
    // siblings so the beam doesn't collapse onto one technique family.
    beam_diversity = true;
    // Give the Reviewer the optional query_metric tool (max_turns 6
    // instead of 4) so it can pull raw NCU counters before judging.
    reviewer_metric_queries = true;
    // K-way Coder fan-out per iter; best-of-survivors becomes the tree
    // node. Must be >= 1 (TypeError/ValueError raised on bad values).
    coder_n_candidates = 4;
    // Maximum search-tree depth (iterations of the expand loop).
    max_depth = 10;
    // Epsilon-greedy frontier selection: start/end of the linear decay
    // over max_depth (explore early, exploit late).
    epsilon_start = 0.3;
    epsilon_end = 0.05;
    // Cap on Planner-rendered FAILED-line count (post-dedup). 0 = uncapped.
    failure_sibling_cap = 8;
    // Per-agent SDK turn-budget overrides. Omit (or leave commented) to
    // preserve the hardcoded defaults: planner = 4, reviewer = 4 when
    // reviewer_metric_queries=false, 6 when true. Setting these values
    // overrides those defaults — used by the LLM-call Pareto sweep.
    // planner_max_turns = 4;
    // reviewer_max_turns = 6;
};

eval:
{
    // CUDA-event timing: untimed warmup launches per workload before
    // the timed window (after the one-shot autotune burn-in).
    warmup_runs = 20;
    // Timed launches per workload; the median is the reported latency.
    timed_runs = 100;
};

move_on:
{
    // Plateau detection: stop when the best SOL score improves by less
    // than sol_plateau_delta over sol_plateau_window consecutive iters.
    sol_plateau_window = 10;
    sol_plateau_delta = 0.01;
    // Early-stop target: terminate when the best (non-dead) node's
    // SOL score reaches this value.
    sol_target = 0.95;
};

debug:
{
    // Coder tool-loop retries per candidate (compile/correctness
    // failures feed back into the turn budget).
    max_debug_retries = 3;
    // LLM baseline-translation attempts before BaselineGenerationError.
    max_baseline_retries = 3;
};

memory:
{
    // Top-K lessons sampled per Planner iter from opt-mem retrieval.
    optimization_memory_top_k = 5;

    // ── Optimization memory (2026-05-24) ──────────────────────────────
    // Distilled lessons from prior runs, stored as JSONL in a single
    // shared global file. AccelOpt-style summary+snippet rows; no
    // profile data, no full kernel source. See doc/memory.md +
    // doc/specs/2026-05-24-optimization-memory-design.md.
    //
    // Read flag: when false, MemoryRetriever.sample() short-circuits
    // to [] without opening the store. Default true.
    opt_mem_read_enabled = true;

    // Write flag: OFF by default — ablation runs cannot pollute the
    // shared store without explicit opt-in. Flip to true in blessed-
    // run configs that should contribute lessons.
    opt_mem_write_enabled = true;

    // Max Experience rows a single session may flush. The cap reserves
    // 1 slot for the run-scope (baseline → best-of-run) lesson; edge
    // lessons contend for cap-1 slots. Lowest-speedup-contribution
    // pending rows evict when the cap is exceeded.
    opt_mem_writes_per_session_cap = 20;

    // δ — per-edge speedup threshold (child_runtime / parent_runtime
    // < 1/δ, equivalently parent/child >= δ) for G1 producer gating.
    // Below this, kernel-timing noise dominates on small workloads.
    // Must be > 1.0. Also applied to G3 cumulative ratio.
    opt_mem_min_improvement_ratio = 1.05;

    // α — exponent on speedup for the retriever's weighted random
    // sample (`weight = speedup ** α`). 0.0 = uniform random
    // (AccelOpt-faithful); 1.0 = linear in speedup; higher = more
    // peaked on top performers. Must be >= 0.0.
    opt_mem_speedup_weight_alpha = 1.0;

    // Shared global store path. All sessions (read or write) point
    // at this same file. .gitignored so accumulated lessons don't
    // end up in commits and developer-local stores don't conflict.
    //
    // When omitted (this whole field), the dataclass default
    // resolves against the repository root via _PROJECT_ROOT
    // (src/config.py) → "<repo>/opt_mem/store.jsonl" — *not* CWD —
    // so a process launched from a subdir doesn't silently split
    // the shared store. When set explicitly here, the literal path
    // is used as-typed; a relative path resolves against CWD as
    // usual. The example below mirrors the default; comment it out
    // to take the dataclass-default repo-anchored behavior.
    opt_mem_store_path = "opt_mem/store.jsonl";
};

benchmark:
{
    // Number of workloads selected (evenly spaced by problem size)
    // from the problem's workload.jsonl for baseline verification,
    // per-iter benchmarking, and the Phase C winner re-profile.
    benchmark_workload_count = 3;
};
