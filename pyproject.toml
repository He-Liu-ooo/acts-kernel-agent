[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acts-kernel-agent"
version = "0.1.0"
description = "LLM-driven GPU kernel optimization via tree search, multi-agent coordination, and persistent optimization memory"
requires-python = ">=3.12"
# SOL-ExecBench is a hard runtime dependency: ACTS uses sol_execbench
# pydantic schemas (Definition / Workload / ToleranceSpec) as its core data
# model, plus gen_inputs / compute_error_stats / do_bench / reward_hack for
# correctness, timing, and Tier 4 anti-cheat. It is *not* installable from
# PyPI in this project's setup — it is installed editable from a local path
# with --no-deps to avoid SOL's CUDA-13-only deps. See configs/venvs/3.12.md
# for the canonical recipe (uv venv + cu128 torch + editable SOL install).
# The `sol` extra below is metadata-only — surface in pyproject for
# discoverability; actual install is `uv pip install -e <SOL path> --no-deps`.
dependencies = [
    "triton>=3.0.0",
    "torch>=2.10",
    "openai-agents>=0.1.0",
    "httpx[socks]>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "safetensors>=0.4",
    "libconf>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
# Experiment-analysis extras. Used by scripts/analyze_llm_call_pareto.py
# (post-hoc sweep analysis) and its tests in
# tests/test_analyze_llm_call_pareto.py. Kept out of `dependencies`
# because the optimization pipeline itself does not import pandas /
# matplotlib — only the offline analysis pipeline does. Install via:
#   pip install -e ".[analysis]"
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]
# Marker extra for SOL-ExecBench. Not resolvable from PyPI — install via:
#   uv pip install -e /path/to/SOL-ExecBench --no-deps
# (see configs/venvs/3.12.md). Listed here so `pip show` / metadata tools
# surface SOL as a declared component rather than a hidden import.
sol = [
    "sol-execbench",
]
# Tier-2 / run-only extra. flashinfer supplies the external reference
# baseline (Option C): its measured latency becomes the SOL-score T_b for
# the flashinfer-trace problems (see
# doc/specs/2026-06-03-external-reference-baseline-design.md). Pinned to
# 0.6.12 to match the wrapper sources extracted from the mit-han-lab-kda
# contest repo (their requirements.txt hard-pins flashinfer-python==0.6.12,
# the API the reference_flashinfer.py wrapper was authored against). Only
# needed in the tier-2 GPU venv; the tier-1 torchless venv never imports it.
# Install with the torch already pinned (cu128 torch 2.11) — installing
# flashinfer with --upgrade churns torch/CUDA, so pin torch in the same
# resolve or install flashinfer last. See configs/venvs/3.12.md.
run = [
    "flashinfer-python==0.6.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "gpu: real-GPU required — skipped on CPU-only CI",
]
